name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pre-commit
        name: Install pre-commit
      - run: pre-commit run --all
        name: Run pre-commit checks

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python_version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t',]
        exclude:
          - python_version: 3.7
            os: macos-14
          - python_version: 3.7
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@2e3e4b15a884dc73a63f962bff250a855150a234
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - name: Setup nox
        run: pip install nox
      - name: Set up Clang (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install clang
      - name: Set up Clang (Cygwin)
        if: matrix.os == 'windows-latest'
        run: choco install llvm -y
      - uses: ilammy/setup-nasm@v1
        if: matrix.os == 'windows-latest'
      - name: Run test CPython
        run: nox -s test-${{ matrix.python_version }}
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
      - name: "Upload artifact"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.python_version }}
          path: ".coverage.*"
          include-hidden-files: true
          if-no-files-found: error

  wasi-sidecar:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Install WASI SDK
        run: |
          curl -fL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz -o /tmp/wasi-sdk.tar.gz
          tar -xf /tmp/wasi-sdk.tar.gz -C /tmp
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-wasip1
      - name: Build WASI extension sidecar
        env:
          PYO3_NO_PYTHON: 1
          CARGO_TARGET_WASM32_WASIP1_LINKER: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang
          CC_wasm32_wasip1: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang
          AR_wasm32_wasip1: /tmp/wasi-sdk-33.0-x86_64-linux/bin/ar
          CFLAGS_wasm32_wasip1: --target=wasm32-wasip1 --sysroot=/tmp/wasi-sdk-33.0-x86_64-linux/share/wasi-sysroot -fPIC
          RUSTFLAGS: >-
            -C link-arg=-L/tmp/wasi-sdk-33.0-x86_64-linux/share/wasi-sysroot/lib/wasm32-wasip1
            -C link-self-contained=no
            -C link-arg=-Wl,--experimental-pic
            -C link-arg=-Wl,--shared
            -C link-arg=-Wl,--allow-undefined
            -C relocation-model=pic
        run: |
          cargo +1.97.0 build --manifest-path rust/Cargo.toml --target wasm32-wasip1 --release
          mkdir -p dist
          cp rust/target/wasm32-wasip1/release/_rustls.wasm dist/_rustls.abi3.so
          sha256sum dist/_rustls.abi3.so
          test "$(od -An -tx1 -N4 dist/_rustls.abi3.so | tr -d ' \n')" = "0061736d"
          /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-objdump -h dist/_rustls.abi3.so | grep dylink.0
      - name: Upload WASI extension sidecar
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wasi-sidecar
          path: dist/_rustls.abi3.so

  smoke_wasi:
    runs-on: ubuntu-latest
    name: WASI Smoke Tests
    timeout-minutes: 20
    needs: wasi-sidecar
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - uses: actions/setup-python@2e3e4b15a884dc73a63f962bff250a855150a234
        with:
          python-version: "3.12"
      - name: Download WASI extension sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasi-sidecar
          path: .nox/wasi-prebuilt
      - name: Install nox
        run: python -m pip install nox
      - name: Run Smoke Test
        run: nox -s wasi
        env:
          RTLS_WASI_SIDECAR: ${{ github.workspace }}/.nox/wasi-prebuilt/_rustls.abi3.so
      - name: Hash WASI binaries
        if: always()
        run: |
          for file in \
            src/rtls/_wasi/_rustls.abi3.so \
            .nox/wasi-artifacts/smoke.wasm \
            .nox/wasi-cache/wasmtime-v47.0.1-x86_64-linux/wasmtime
          do
            test ! -f "$file" || sha256sum "$file"
          done
      - name: Upload WASI binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wasi-smoke-binaries-${{ github.run_attempt }}
          path: |
            src/rtls/_wasi/_rustls.abi3.so
            .nox/wasi-artifacts/smoke.wasm
          include-hidden-files: true
          if-no-files-found: warn

  coverage:
    if: always()
    runs-on: "ubuntu-latest"
    needs: test
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@d632683dd7b4114ad314bca15554477dd762a938"

      - name: "Setup Python"
        uses: "actions/setup-python@2e3e4b15a884dc73a63f962bff250a855150a234"
        with:
          python-version: "3.x"

      - name: "Install coverage"
        run: "python -m pip install --upgrade coverage"

      - name: "Download artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: "Combine & check coverage"
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=99

      - name: "Upload report"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-report
          path: htmlcov

  linux:
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - smoke_wasi
      - wasi-sidecar
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64, s390x, aarch64, armv7l, ppc64le, ppc64, i686 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
        manylinux: [ 'manylinux2014', 'musllinux_1_1' ]
        exclude:
          - manylinux: musllinux_1_1
            target: s390x
          - manylinux: musllinux_1_1
            target: ppc64
          - manylinux: musllinux_1_1
            target: ppc64le
        include:
          - manylinux: manylinux_2_39
            target: riscv64gc-unknown-linux-gnu
            python_version: '3.10'
          - manylinux: manylinux_2_39
            target: riscv64gc-unknown-linux-gnu
            python_version: '3.13t'
          - manylinux: manylinux_2_39
            target: riscv64gc-unknown-linux-gnu
            python_version: '3.14t'
          - manylinux: musllinux_1_1
            target: riscv64gc-unknown-linux-musl
            python_version: '3.10'
          - manylinux: musllinux_1_1
            target: riscv64gc-unknown-linux-musl
            python_version: '3.13t'
          - manylinux: musllinux_1_1
            target: riscv64gc-unknown-linux-musl
            python_version: '3.14t'

    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Download WASI extension sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasi-sidecar
          path: src/rtls/_wasi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - name: Build wheels (no workarounds)
        if: matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            sudo wget https://gist.githubusercontent.com/Ousret/ae53d8c725a2ad48c133afce313ffdcc/raw/3671b2081742f3d5152cd67f1d813ea3cbd84d50/queue.h -O /usr/local/musl/bin/../x86_64-unknown-linux-musl/include/sys/queue.h || echo "compat x64 fail"
            yum install -y llvm-toolset-7-clang || echo "not yum based"
            source /opt/rh/llvm-toolset-7/enable || echo "not yum based"

      - name: Build wheels (aarch64+musl workaround)
        if: matrix.target == 'aarch64' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            sudo wget https://gist.githubusercontent.com/Ousret/ae53d8c725a2ad48c133afce313ffdcc/raw/3671b2081742f3d5152cd67f1d813ea3cbd84d50/queue.h -O /usr/local/musl/bin/../aarch64-unknown-linux-musl/include/sys/queue.h || echo "compat fail"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/bin/../aarch64-unknown-linux-musl/"

      - name: Build wheels (aarch64+manylinux2014 workaround)
        if: matrix.target == 'aarch64' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8 -DAT_HWCAP2=26"
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot"

      - name: Build wheels (s390x+manylinux2014 workaround)
        if: matrix.target == 's390x' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/s390x-ibm-linux-gnu/s390x-ibm-linux-gnu/sysroot"

      - name: Build wheels (i686+manylinux2014 workaround)
        if: matrix.target == 'i686' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          container: messense/manylinux2014-cross:i686
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/i686-unknown-linux-gnu/i686-unknown-linux-gnu/sysroot"

      - name: Build wheels (ppc64le+manylinux2014 workaround)
        if: matrix.target == 'ppc64le' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/powerpc64le-unknown-linux-gnu/powerpc64le-unknown-linux-gnu/sysroot"
            wget https://gist.githubusercontent.com/Ousret/2e7a58fc2baf773f6e38e78963e8985f/raw/05a99d92817473ae5cf8360b8df3f85f47d0a12a/elf.h -O /usr/powerpc64le-unknown-linux-gnu/powerpc64le-unknown-linux-gnu/sysroot/usr/include/elf.h

      - name: Build wheels (ppc64+manylinux2014 workaround)
        if: matrix.target == 'ppc64' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/powerpc64-unknown-linux-gnu/powerpc64-unknown-linux-gnu/sysroot"

      - name: Build wheels (riscv+manylinux_2_39 workaround)
        if: matrix.target == 'riscv64gc-unknown-linux-gnu' && matrix.manylinux == 'manylinux_2_39'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          container: ghcr.io/rust-cross/manylinux_2_39-cross:riscv64
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib || echo "no apt support"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/riscv64-unknown-linux-gnu/riscv64-unknown-linux-gnu/sysroot"

      - name: Build wheels (riscv+manylinux_2_39 workaround)
        if: matrix.target == 'riscv64gc-unknown-linux-musl' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          container: ghcr.io/rust-cross/rust-musl-cross:riscv64gc-musl
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            sudo wget https://gist.githubusercontent.com/Ousret/ae53d8c725a2ad48c133afce313ffdcc/raw/3671b2081742f3d5152cd67f1d813ea3cbd84d50/queue.h -O /usr/local/musl/riscv64-unknown-linux-musl/include/sys/queue.h || echo "compat fail"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/riscv64-unknown-linux-musl"

      - name: Build wheels (armv7l+manylinux workaround)
        if: matrix.target == 'armv7l' && matrix.manylinux == 'manylinux2014'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            wget https://gist.githubusercontent.com/Ousret/2e7a58fc2baf773f6e38e78963e8985f/raw/05a99d92817473ae5cf8360b8df3f85f47d0a12a/elf.h -O /usr/armv7-unknown-linux-gnueabihf/armv7-unknown-linux-gnueabihf/sysroot/usr/include/elf.h

      - name: Build wheels (armv7l+musl workaround)
        if: matrix.target == 'armv7l' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            sudo wget https://gist.githubusercontent.com/Ousret/ae53d8c725a2ad48c133afce313ffdcc/raw/3671b2081742f3d5152cd67f1d813ea3cbd84d50/queue.h -O /usr/local/musl/armv7-unknown-linux-musleabihf/include/sys/queue.h || echo "compat fail"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/armv7-unknown-linux-musleabihf"

      - name: Build wheels (i686+musl workaround)
        if: matrix.target == 'i686' && matrix.manylinux == 'musllinux_1_1'
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e UNSAFE_PYO3_SKIP_VERSION_CHECK=1
          before-script-linux: |
            sudo apt-get update || echo "no apt support"
            sudo apt-get install -y libclang || echo "no apt support"
            sudo apt-get install -y libc6 || echo "no apt support"
            sudo apt-get install -y libc6-dev || echo "no apt support"
            sudo apt-get install -y libclang-dev || echo "no apt support"
            sudo apt-get install -y clang || echo "no apt support"
            sudo apt-get install -y linux-headers-generic || echo "no apt support"
            sudo apt-get install -y gcc-multilib wget || echo "no apt support"
            sudo wget https://gist.githubusercontent.com/Ousret/ae53d8c725a2ad48c133afce313ffdcc/raw/3671b2081742f3d5152cd67f1d813ea3cbd84d50/queue.h -O /usr/local/musl/i686-unknown-linux-musl/include/sys/queue.h || echo "compat fail"
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=/usr/local/musl/i686-unknown-linux-musl"

      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}-${{ matrix.python_version }}
          path: dist/*.whl

  windows:
    needs:
      - test
      - lint
      - smoke_wasi
      - wasi-sidecar
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ x64, aarch64, x86 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Download WASI extension sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasi-sidecar
          path: src/rtls/_wasi
      - uses: actions/setup-python@v6
        if: matrix.target != 'aarch64'
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.target == 'x86' && 'x86' || 'x64' }}
          allow-prereleases: true
      - uses: ilammy/setup-nasm@v1
      - name: Set up Clang (Cygwin)
        run: choco install llvm -y
      - name: Add Ninja (aarch64 build requirement)
        if: matrix.target == 'aarch64'
        run: choco install ninja -y
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        if: matrix.target != 'aarch64'
        env:
          XWIN_VERSION: 16  # fix for "no cab file specified by MSI" ...?
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Build wheels (force CROSS aarch64)
        uses: PyO3/maturin-action@v1
        if: matrix.target == 'aarch64'
        env:
          XWIN_VERSION: 16  # fix for "no cab file specified by MSI" ...?
          PYO3_CROSS: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  macos:
    needs:
      - test
      - lint
      - smoke_wasi
      - wasi-sidecar
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [ universal2 ]
        python_version: [ '3.10', '3.13t', '3.14t' ]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Download WASI extension sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasi-sidecar
          path: src/rtls/_wasi
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          UNSAFE_PYO3_SKIP_VERSION_CHECK: 1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python_version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python_version }}
          path: dist/*.whl

  sdist:
    needs:
      - test
      - lint
      - smoke_wasi
      - wasi-sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
      - name: Download WASI extension sidecar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wasi-sidecar
          path: src/rtls/_wasi
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  checksum:
    name: compute hashes
    runs-on: ubuntu-latest
    needs: [windows, macos, linux, sdist]
    outputs:
      hashes: ${{ steps.compute.outputs.hashes }}
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Collected dists
        run: |
          tree dist
      - name: Generate hashes
        id: compute  #  needs.checksum.outputs.hashes
        working-directory: ./dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

  provenance:
    needs: checksum
    if: "startsWith(github.ref, 'refs/tags/')"
    uses: "slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0"
    permissions:
      actions: read
      id-token: write
      contents: write
    with:
      base64-subjects: ${{ needs.checksum.outputs.hashes }}
      upload-assets: true
      compile-generator: true

  release:
    name: release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: provenance
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: "Upload dists to GitHub Release"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release upload ${{ github.ref_name }} dist/* --repo ${{ github.repository }}
      - name: Publish to PyPI
        uses: "pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e" # v1.13.0
        with:
          attestations: true
